<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#1A1714"/>
  <!-- Phone frame -->
  <rect x="270" y="50" width="260" height="500" rx="28" fill="#0F0D0B" stroke="#2E2A25" stroke-width="3"/>
  <rect x="285" y="82" width="230" height="436" rx="6" fill="#161311"/>
  <!-- App header -->
  <rect x="285" y="82" width="230" height="56" rx="6" fill="#C8102E"/>
  <text x="400" y="117" font-family="Georgia,serif" font-size="18" font-weight="bold" fill="#FBFAF6" text-anchor="middle">DRISHTI</text>
  <!-- Camera viewfinder -->
  <rect x="298" y="150" width="204" height="168" rx="4" fill="#0A0908"/>
  <rect x="298" y="150" width="204" height="168" rx="4" fill="none" stroke="#C8102E" stroke-width="2" stroke-dasharray="16 6"/>
  <path d="M308 160 L308 178 M308 160 L326 160" stroke="#C8102E" stroke-width="2.5" fill="none"/>
  <path d="M492 160 L492 178 M492 160 L474 160" stroke="#C8102E" stroke-width="2.5" fill="none"/>
  <path d="M308 308 L308 290 M308 308 L326 308" stroke="#C8102E" stroke-width="2.5" fill="none"/>
  <path d="M492 308 L492 290 M492 308 L474 308" stroke="#C8102E" stroke-width="2.5" fill="none"/>
  <!-- Currency note inside viewfinder -->
  <rect x="326" y="196" width="148" height="88" rx="3" fill="#2A2520" stroke="#3A3530" stroke-width="1"/>
  <text x="400" y="228" font-family="monospace" font-size="14" fill="#C8102E" text-anchor="middle">NRS 500</text>
  <text x="400" y="250" font-family="monospace" font-size="9" fill="#5A5550" text-anchor="middle">NEPAL RASTRA BANK</text>
  <line x1="336" y1="264" x2="464" y2="264" stroke="#3A3530" stroke-width="1"/>
  <!-- Result panel -->
  <rect x="285" y="330" width="230" height="72" fill="#1C1A17"/>
  <text x="306" y="352" font-family="monospace" font-size="10" fill="#8B867B">DETECTED</text>
  <text x="306" y="384" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#C8102E">NRS 500</text>
  <text x="460" y="378" font-family="monospace" font-size="11" fill="#5A5550">98%</text>
  <!-- Bottom nav -->
  <rect x="285" y="414" width="230" height="104" rx="6" fill="#1E1B17"/>
  <circle cx="400" cy="458" r="26" fill="#C8102E" opacity="0.18"/>
  <text x="400" y="466" font-family="sans-serif" font-size="26" fill="#C8102E" text-anchor="middle">◎</text>
  <text x="400" y="500" font-family="monospace" font-size="10" fill="#5A5550" text-anchor="middle">TAP TO SCAN</text>
  <!-- Caption bar -->
  <rect x="0" y="560" width="800" height="40" fill="#161311"/>
  <text x="30" y="585" font-family="monospace" font-size="12" fill="#8B867B">PHOTO / Drishti · computer vision for visually impaired users · kathmandu</text>
</svg>

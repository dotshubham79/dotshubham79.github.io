  <rect x="144" y="118" width="192" height="60" fill="#1A2E18"/>
  <text x="154" y="138" font-family="monospace" font-size="9" fill="#8BC88A">TODAY · TERAI</text>
  <text x="154" y="158" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#FBFAF6">28°C</text>
  <text x="230" y="156" font-family="monospace" font-size="9" fill="#5A8A58">☁ partly cloudy</text>
  <!-- Crop prices list -->
  <rect x="144" y="178" width="192" height="24" fill="#252220"/>
  <text x="154" y="194" font-family="monospace" font-size="9" fill="#8B867B">LIVE MARKET PRICES</text>

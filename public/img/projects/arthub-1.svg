<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FBFAF6"/>
  <!-- Map background grid -->
  <g stroke="#E8E4D8" stroke-width="0.8" opacity="0.9">
    <line x1="0" y1="60" x2="800" y2="60"/><line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/><line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
    <line x1="80" y1="0" x2="80" y2="600"/><line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/><line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/><line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/><line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
  </g>
  <!-- Streets -->
  <path d="M0 200 Q200 190 400 210 T800 200" stroke="#D8D4C8" stroke-width="6" fill="none"/>
  <path d="M0 380 Q300 370 500 390 T800 380" stroke="#D8D4C8" stroke-width="6" fill="none"/>
  <path d="M150 0 Q160 150 155 300 T150 600" stroke="#D8D4C8" stroke-width="8" fill="none"/>
  <path d="M450 0 Q460 200 455 400 T450 600" stroke="#D8D4C8" stroke-width="8" fill="none"/>
  <path d="M650 0 Q655 200 650 400 T650 600" stroke="#D8D4C8" stroke-width="5" fill="none"/>
  <!-- Art location pins -->
  <!-- Pin 1 - large featured -->
  <g transform="translate(200,280)">
    <circle r="18" fill="#C8102E" opacity="0.9"/>
    <text y="5" font-family="sans-serif" font-size="14" fill="#FBFAF6" text-anchor="middle">🎨</text>
    <rect x="-48" y="-52" width="96" height="28" rx="4" fill="#161513"/>
    <text x="0" y="-33" font-family="monospace" font-size="9" fill="#FBFAF6" text-anchor="middle">MURALIST: ANISH K.</text>
  </g>
  <!-- Pin 2 -->
  <g transform="translate(380,160)">
    <circle r="14" fill="#C8102E" opacity="0.8"/>
    <text y="4" font-family="sans-serif" font-size="11" fill="#FBFAF6" text-anchor="middle">🎨</text>
    <rect x="-40" y="-44" width="80" height="24" rx="3" fill="#161513"/>
    <text x="0" y="-27" font-family="monospace" font-size="8" fill="#FBFAF6" text-anchor="middle">STREET ART ×3</text>
  </g>
  <!-- Pin 3 -->
  <g transform="translate(540,320)">
    <circle r="14" fill="#C8102E" opacity="0.8"/>
    <text y="4" font-family="sans-serif" font-size="11" fill="#FBFAF6" text-anchor="middle">🎨</text>
  </g>
  <!-- Pin 4 -->
  <g transform="translate(100,150)">
    <circle r="10" fill="#E89B2C" opacity="0.9"/>
    <text y="3" font-family="sans-serif" font-size="8" fill="#FBFAF6" text-anchor="middle">🎨</text>
  </g>
  <!-- Pin 5 -->
  <g transform="translate(660,240)">
    <circle r="10" fill="#E89B2C" opacity="0.9"/>
    <text y="3" font-family="sans-serif" font-size="8" fill="#FBFAF6" text-anchor="middle">🎨</text>
  </g>
  <!-- Pin 6 -->
  <g transform="translate(290,430)">
    <circle r="10" fill="#C8102E" opacity="0.7"/>
    <text y="3" font-family="sans-serif" font-size="8" fill="#FBFAF6" text-anchor="middle">🎨</text>
  </g>
  <!-- Pin 7 -->
  <g transform="translate(600,460)">
    <circle r="10" fill="#E89B2C" opacity="0.8"/>
  </g>
  <!-- Info panel overlay -->
  <rect x="480" y="380" width="290" height="140" rx="4" fill="#fff" stroke="#D8D4C8" stroke-width="1.5"/>
  <rect x="480" y="380" width="290" height="36" rx="4" fill="#161513"/>
  <text x="500" y="403" font-family="monospace" font-size="11" fill="#FBFAF6">ARTHUB · KATHMANDU</text>
  <text x="500" y="435" font-family="Georgia,serif" font-size="13" fill="#161513">35+ street artists mapped.</text>
  <text x="500" y="456" font-family="Georgia,serif" font-size="13" fill="#161513">React + Google Maps.</text>
  <text x="500" y="477" font-family="monospace" font-size="10" fill="#C8102E">Visibility ×3 after launch film.</text>
  <text x="500" y="500" font-family="monospace" font-size="10" fill="#8B867B">arthub.xyz · arts + growth</text>
  <!-- Title area -->
  <rect x="0" y="0" width="800" height="52" fill="#161513"/>
  <text x="30" y="32" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#FBFAF6">ArtHub</text>
  <text x="140" y="32" font-family="monospace" font-size="11" fill="#C8102E">street art discovery map · kathmandu</text>
  <text x="700" y="32" font-family="monospace" font-size="11" fill="#8B867B">35+ artists</text>
  <!-- Caption -->
  <rect x="0" y="560" width="800" height="40" fill="#161513"/>
  <text x="30" y="585" font-family="monospace" font-size="12" fill="#8B867B">PHOTO — ArtHub map / a featured mural · the map, the murals</text>
</svg>

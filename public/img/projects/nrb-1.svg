  <rect x="0" y="0" width="800" height="56" fill="#161513"/>
  <text x="30" y="26" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#FBFAF6">Interbank Platform Blueprint</text>
  <text x="30" y="46" font-family="monospace" font-size="10" fill="#C8102E">Nepal Rastra Bank · monetary policy analyst · national reform agenda</text>
  <text x="700" y="34" font-family="Georgia,serif" font-size="20" font-weight="bold" fill="#E89B2C">$20B</text>
  <text x="700" y="48" font-family="monospace" font-size="9" fill="#8B867B">shaped</text>
  <!-- Caption -->
  <rect x="0" y="560" width="800" height="40" fill="#161513"/>
  <text x="30" y="585" font-family="monospace" font-size="12" fill="#8B867B">PHOTO / NRB / presenting the blueprint · nepal rastra bank</text>

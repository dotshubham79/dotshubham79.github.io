<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#F5F0E8"/>
  <line x1="60" y1="0" x2="60" y2="600" stroke="#C8102E" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="80" x2="800" y2="80" stroke="#E0D8C8" stroke-width="1"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#E0D8C8" stroke-width="1"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#E0D8C8" stroke-width="1"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#E0D8C8" stroke-width="1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#E0D8C8" stroke-width="1"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#E0D8C8" stroke-width="1"/>
  <!-- Prototype bag: structured tote with visible construction lines -->
  <g transform="translate(160,60)">
    <!-- Main body -->
    <path d="M40 120 L20 380 L420 380 L400 120 Z" fill="#2A2218" stroke="#161311" stroke-width="2"/>
    <!-- Construction/seam lines -->
    <line x1="220" y1="120" x2="220" y2="380" stroke="#C8102E" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
    <line x1="40" y1="250" x2="400" y2="250" stroke="#E89B2C" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>
    <!-- Handles -->
    <path d="M100 120 Q120 60 180 60 Q240 60 260 120" fill="none" stroke="#2A2218" stroke-width="14" stroke-linecap="round"/>
    <path d="M100 120 Q120 60 180 60 Q240 60 260 120" fill="none" stroke="#3A3228" stroke-width="10" stroke-linecap="round"/>
    <path d="M180 120 Q200 60 260 60 Q320 60 340 120" fill="none" stroke="#2A2218" stroke-width="14" stroke-linecap="round"/>
    <path d="M180 120 Q200 60 260 60 Q320 60 340 120" fill="none" stroke="#3A3228" stroke-width="10" stroke-linecap="round"/>
    <!-- Motif embossed on front panel -->
    <polygon points="220,170 200,210 240,210" fill="none" stroke="#C8102E" stroke-width="2"/>
    <polygon points="220,185 207,210 233,210" fill="#C8102E" fill-opacity="0.25"/>
    <!-- Bottom seam -->
    <line x1="30" y1="360" x2="410" y2="360" stroke="#3A3228" stroke-width="3"/>
    <!-- Corner reinforcement tabs -->
    <rect x="20" y="350" width="20" height="30" rx="2" fill="#E89B2C" opacity="0.7"/>
    <rect x="400" y="350" width="20" height="30" rx="2" fill="#E89B2C" opacity="0.7"/>
    <!-- Measurement annotation -->
    <line x1="20" y1="395" x2="420" y2="395" stroke="#8B867B" stroke-width="1"/>
    <line x1="20" y1="390" x2="20" y2="400" stroke="#8B867B" stroke-width="1"/>
    <line x1="420" y1="390" x2="420" y2="400" stroke="#8B867B" stroke-width="1"/>
    <text x="220" y="415" font-family="monospace" font-size="10" fill="#8B867B" text-anchor="middle">38 cm</text>
    <line x1="-5" y1="120" x2="-5" y2="380" stroke="#8B867B" stroke-width="1"/>
    <line x1="-10" y1="120" x2="0" y2="120" stroke="#8B867B" stroke-width="1"/>
    <line x1="-10" y1="380" x2="0" y2="380" stroke="#8B867B" stroke-width="1"/>
    <text x="-20" y="255" font-family="monospace" font-size="10" fill="#8B867B" text-anchor="middle" transform="rotate(-90,-20,255)">28 cm</text>
  </g>
  <!-- Material swatches -->
  <rect x="580" y="80" width="180" height="220" rx="3" fill="#fff" stroke="#E0D8C8" stroke-width="1.5"/>
  <rect x="580" y="80" width="180" height="30" rx="3" fill="#161513"/>
  <text x="670" y="100" font-family="monospace" font-size="10" fill="#FBFAF6" text-anchor="middle">MATERIAL TEST</text>
  <rect x="596" y="122" width="60" height="60" fill="#2A2218"/>
  <text x="626" y="196" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">Dhaka</text>
  <text x="626" y="207" font-family="monospace" font-size="8" fill="#5A5550" text-anchor="middle">weave</text>
  <rect x="672" y="122" width="60" height="60" fill="#8B6A3E"/>
  <text x="702" y="196" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">Lokta</text>
  <text x="702" y="207" font-family="monospace" font-size="8" fill="#5A5550" text-anchor="middle">lining</text>
  <rect x="596" y="218" width="60" height="60" fill="#4A3A28"/>
  <text x="626" y="292" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">Leather</text>
  <text x="626" y="303" font-family="monospace" font-size="8" fill="#5A5550" text-anchor="middle">strap</text>
  <rect x="672" y="218" width="60" height="60" fill="#C8102E" opacity="0.8"/>
  <text x="702" y="292" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">Tika</text>
  <text x="702" y="303" font-family="monospace" font-size="8" fill="#5A5550" text-anchor="middle">lining</text>
  <!-- Notes card -->
  <rect x="580" y="320" width="180" height="180" rx="3" fill="#fff" stroke="#E0D8C8" stroke-width="1.5"/>
  <text x="596" y="346" font-family="monospace" font-size="9" fill="#8B867B">PROTOTYPE NOTES</text>
  <text x="596" y="368" font-family="Georgia,serif" font-size="12" fill="#161513">Handle tension: ✓</text>
  <text x="596" y="388" font-family="Georgia,serif" font-size="12" fill="#161513">Motif placement: ✓</text>
  <text x="596" y="408" font-family="Georgia,serif" font-size="12" fill="#C8102E">Corner seam: revisit</text>
  <text x="596" y="428" font-family="Georgia,serif" font-size="12" fill="#161513">Lining weight: ✓</text>
  <line x1="596" y1="440" x2="744" y2="440" stroke="#E0D8C8" stroke-width="1"/>
  <text x="596" y="460" font-family="monospace" font-size="9" fill="#C8102E">Run 2 scheduled</text>
  <text x="596" y="476" font-family="monospace" font-size="9" fill="#8B867B">prototype table · 2024</text>
  <!-- Title -->
  <rect x="0" y="0" width="800" height="52" fill="#161513"/>
  <text x="30" y="24" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#FBFAF6">Resha — Prototype</text>
  <text x="210" y="24" font-family="monospace" font-size="10" fill="#E89B2C">production prototype · material testing · construction review</text>
  <text x="30" y="43" font-family="monospace" font-size="10" fill="#8B867B">HIMAL collection · run 1</text>
  <!-- Caption -->
  <rect x="0" y="560" width="800" height="40" fill="#161513"/>
  <text x="30" y="585" font-family="monospace" font-size="12" fill="#8B867B">PHOTO — prototype bag / material test · prototype table</text>
</svg>

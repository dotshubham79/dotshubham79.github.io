<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FBFAF6"/>
  <!-- Ruled paper background -->
  <line x1="0" y1="80" x2="800" y2="80" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="120" x2="800" y2="120" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#D8D4C8" stroke-width="1"/>
  <line x1="60" y1="0" x2="60" y2="600" stroke="#C8102E" stroke-width="1.5" opacity="0.4"/>
  <!-- Phone frame -->
  <rect x="130" y="40" width="220" height="480" rx="22" fill="#161513" stroke="#2E2A25" stroke-width="2"/>
  <rect x="144" y="68" width="192" height="424" rx="5" fill="#1E1B17"/>
  <!-- App header green -->
  <rect x="144" y="68" width="192" height="50" rx="5" fill="#2D5A27"/>
  <text x="240" y="100" font-family="Georgia,serif" font-size="15" font-weight="bold" fill="#FBFAF6" text-anchor="middle">KISAN</text>

  <text x="154" y="222" font-family="monospace" font-size="10" fill="#FBFAF6">Rice</text>
  <text x="292" y="222" font-family="monospace" font-size="10" fill="#C8102E" text-anchor="end">NRS 48/kg</text>
  <text x="154" y="235" font-family="monospace" font-size="9" fill="#5A5550">▲ 2.1% today</text>
  <line x1="144" y1="238" x2="336" y2="238" stroke="#2E2A25" stroke-width="0.5"/>
  <rect x="144" y="238" width="192" height="36" fill="#1E1B17"/>
  <text x="154" y="258" font-family="monospace" font-size="10" fill="#FBFAF6">Wheat</text>
  <text x="292" y="258" font-family="monospace" font-size="10" fill="#8BC88A" text-anchor="end">NRS 35/kg</text>
  <text x="154" y="271" font-family="monospace" font-size="9" fill="#5A5550">▼ 0.8% today</text>
  <line x1="144" y1="274" x2="336" y2="274" stroke="#2E2A25" stroke-width="0.5"/>
  <rect x="144" y="274" width="192" height="36" fill="#1E1B17"/>
  <text x="154" y="294" font-family="monospace" font-size="10" fill="#FBFAF6">Maize</text>
  <text x="292" y="294" font-family="monospace" font-size="10" fill="#C8102E" text-anchor="end">NRS 22/kg</text>
  <text x="154" y="307" font-family="monospace" font-size="9" fill="#5A5550">▲ 5.3% today</text>
  <line x1="144" y1="310" x2="336" y2="310" stroke="#2E2A25" stroke-width="0.5"/>
  <rect x="144" y="310" width="192" height="36" fill="#1E1B17"/>
  <text x="154" y="330" font-family="monospace" font-size="10" fill="#FBFAF6">Lentils</text>
  <text x="292" y="330" font-family="monospace" font-size="10" fill="#8BC88A" text-anchor="end">NRS 140/kg</text>
  <text x="154" y="343" font-family="monospace" font-size="9" fill="#5A5550">— unchanged</text>
  <!-- Graph area -->
  <rect x="144" y="354" width="192" height="90" fill="#161311"/>
  <text x="154" y="372" font-family="monospace" font-size="9" fill="#8B867B">RICE PRICE · 30 DAYS</text>
  <polyline points="154,430 175,422 196,425 217,415 238,418 259,408 280,412 301,400 322,406 336,398" fill="none" stroke="#C8102E" stroke-width="1.5"/>
  <polyline points="154,430 175,422 196,425 217,415 238,418 259,408 280,412 301,400 322,406 336,398" fill="url(#grad)" stroke="none"/>
  <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C8102E" stop-opacity="0.2"/><stop offset="100%" stop-color="#C8102E" stop-opacity="0"/></linearGradient></defs>
  <!-- Bottom nav -->
  <rect x="144" y="444" width="192" height="48" fill="#252220"/>
  <text x="175" y="472" font-family="monospace" font-size="18" fill="#2D5A27" text-anchor="middle">⚡</text>
  <text x="240" y="472" font-family="monospace" font-size="18" fill="#8B867B" text-anchor="middle">🌦</text>
  <text x="305" y="472" font-family="monospace" font-size="18" fill="#8B867B" text-anchor="middle">☰</text>
  <!-- Right side content -->
  <rect x="400" y="60" width="340" height="180" fill="#fff" stroke="#D8D4C8" stroke-width="1"/>
  <text x="420" y="90" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#161513">Field Research</text>
  <text x="420" y="112" font-family="monospace" font-size="11" fill="#C8102E">Terai Region · 2023</text>
  <text x="420" y="140" font-family="Georgia,serif" font-size="13" fill="#161513">Roadmapped from sessions</text>
  <text x="420" y="160" font-family="Georgia,serif" font-size="13" fill="#161513">with farmers themselves.</text>
  <text x="420" y="180" font-family="Georgia,serif" font-size="13" fill="#161513">Launched on Google Play.</text>
  <text x="420" y="210" font-family="monospace" font-size="11" fill="#8B867B">1,000+ farmers · play store</text>
  <!-- Stat boxes -->
  <rect x="400" y="260" width="160" height="100" fill="#161513"/>
  <text x="420" y="300" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#C8102E">1K+</text>
  <text x="420" y="325" font-family="monospace" font-size="10" fill="#8B867B">farmers reached</text>
  <text x="420" y="342" font-family="monospace" font-size="10" fill="#5A5550">across nepal</text>
  <rect x="580" y="260" width="160" height="100" fill="#2D5A27"/>
  <text x="600" y="300" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#FBFAF6">Live</text>
  <text x="600" y="325" font-family="monospace" font-size="10" fill="#8BC88A">market prices</text>
  <text x="600" y="342" font-family="monospace" font-size="10" fill="#5A8A58">weather APIs</text>
  <!-- Caption -->
  <rect x="0" y="560" width="800" height="40" fill="#161513"/>
  <text x="30" y="585" font-family="monospace" font-size="12" fill="#8B867B">PHOTO — Kisan app screens / farmer research session · terai, nepal</text>

  <text x="40" y="166" font-family="Georgia,serif" font-size="12" fill="#161513">interviewed.</text>
  <text x="40" y="184" font-family="monospace" font-size="10" fill="#C8102E">Blueprint adopted.</text>
  <text x="40" y="204" font-family="monospace" font-size="9" fill="#8B867B">age 19.</text>
  <!-- Second card -->
  <rect x="590" y="200" width="180" height="160" rx="3" fill="#161513"/>
  <text x="608" y="228" font-family="monospace" font-size="10" fill="#8B867B">BENCHMARKED</text>
  <text x="608" y="258" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#C8102E">8yrs</text>
  <text x="608" y="278" font-family="monospace" font-size="10" fill="#8B867B">global policy</text>
  <line x1="608" y1="292" x2="758" y2="292" stroke="#2E2A25" stroke-width="1"/>
  <text x="608" y="312" font-family="monospace" font-size="10" fill="#8B867B">SOFR · TARGET2</text>
  <text x="608" y="332" font-family="monospace" font-size="10" fill="#8B867B">SONIA benchmarks</text>
  <text x="608" y="350" font-family="monospace" font-size="9" fill="#5A5550">interbank platform</text>

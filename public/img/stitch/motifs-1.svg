<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#F5F0E8"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="52" fill="#161513"/>
  <text x="30" y="24" font-family="Georgia,serif" font-size="17" font-weight="bold" fill="#FBFAF6">Motif Research Wall</text>
  <text x="230" y="24" font-family="monospace" font-size="10" fill="#E89B2C">150+ traditional motifs · studied, sorted, distilled</text>
  <text x="30" y="43" font-family="monospace" font-size="10" fill="#8B867B">Resha / Stitch · 45+ interviews · reduced by hand</text>
  <!-- Grid of motif cards -->
  <!-- Row 1 -->
  <g transform="translate(30,72)">
    <!-- Motif 1: Diamond lattice -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <path d="M50 10 L90 50 L50 90 L10 50 Z" fill="none" stroke="#C8102E" stroke-width="1.5"/>
    <path d="M50 25 L75 50 L50 75 L25 50 Z" fill="none" stroke="#C8102E" stroke-width="1"/>
    <path d="M50 40 L60 50 L50 60 L40 50 Z" fill="#C8102E" fill-opacity="0.4"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">diamond</text>
  </g>
  <g transform="translate(145,72)">
    <!-- Motif 2: Peacock feather -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <ellipse cx="50" cy="55" rx="18" ry="26" fill="none" stroke="#C8102E" stroke-width="1.5"/>
    <ellipse cx="50" cy="52" rx="10" ry="16" fill="none" stroke="#E89B2C" stroke-width="1"/>
    <circle cx="50" cy="50" r="5" fill="#C8102E" fill-opacity="0.5"/>
    <line x1="50" y1="80" x2="50" y2="100" stroke="#8B867B" stroke-width="1.5"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">mayur</text>
  </g>
  <g transform="translate(260,72)">
    <!-- Motif 3: Sun wheel -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <circle cx="50" cy="50" r="28" fill="none" stroke="#E89B2C" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="14" fill="none" stroke="#E89B2C" stroke-width="1"/>
    <circle cx="50" cy="50" r="5" fill="#E89B2C" fill-opacity="0.6"/>
    <line x1="50" y1="22" x2="50" y2="10" stroke="#E89B2C" stroke-width="1.5"/>
    <line x1="50" y1="78" x2="50" y2="90" stroke="#E89B2C" stroke-width="1.5"/>
    <line x1="22" y1="50" x2="10" y2="50" stroke="#E89B2C" stroke-width="1.5"/>
    <line x1="78" y1="50" x2="90" y2="50" stroke="#E89B2C" stroke-width="1.5"/>
    <line x1="30" y1="30" x2="22" y2="22" stroke="#E89B2C" stroke-width="1"/>
    <line x1="70" y1="30" x2="78" y2="22" stroke="#E89B2C" stroke-width="1"/>
    <line x1="30" y1="70" x2="22" y2="78" stroke="#E89B2C" stroke-width="1"/>
    <line x1="70" y1="70" x2="78" y2="78" stroke="#E89B2C" stroke-width="1"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">surya</text>
  </g>
  <g transform="translate(375,72)">
    <!-- Motif 4: Lotus -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <ellipse cx="50" cy="60" rx="16" ry="22" fill="none" stroke="#C8102E" stroke-width="1.5"/>
    <ellipse cx="34" cy="60" rx="12" ry="18" fill="none" stroke="#C8102E" stroke-width="1"/>
    <ellipse cx="66" cy="60" rx="12" ry="18" fill="none" stroke="#C8102E" stroke-width="1"/>
    <ellipse cx="50" cy="75" rx="20" ry="8" fill="#C8102E" fill-opacity="0.1" stroke="#C8102E" stroke-width="1"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">kamal</text>
  </g>
  <g transform="translate(490,72)">
    <!-- Motif 5: Step pyramid -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <rect x="35" y="70" width="30" height="14" fill="none" stroke="#161513" stroke-width="1.5"/>
    <rect x="27" y="56" width="46" height="14" fill="none" stroke="#161513" stroke-width="1.5"/>
    <rect x="19" y="42" width="62" height="14" fill="none" stroke="#161513" stroke-width="1.5"/>
    <rect x="11" y="28" width="78" height="14" fill="none" stroke="#C8102E" stroke-width="1.5"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">shikhara</text>
  </g>
  <g transform="translate(605,72)">
    <!-- Motif 6: Fish scales -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <ellipse cx="30" cy="35" rx="18" ry="14" fill="none" stroke="#C8102E" stroke-width="1"/>
    <ellipse cx="56" cy="35" rx="18" ry="14" fill="none" stroke="#C8102E" stroke-width="1"/>
    <ellipse cx="82" cy="35" rx="18" ry="14" fill="none" stroke="#C8102E" stroke-width="1"/>
    <ellipse cx="43" cy="53" rx="18" ry="14" fill="none" stroke="#E89B2C" stroke-width="1"/>
    <ellipse cx="69" cy="53" rx="18" ry="14" fill="none" stroke="#E89B2C" stroke-width="1"/>
    <ellipse cx="30" cy="71" rx="18" ry="14" fill="none" stroke="#C8102E" stroke-width="1"/>
    <ellipse cx="56" cy="71" rx="18" ry="14" fill="none" stroke="#C8102E" stroke-width="1"/>
    <ellipse cx="82" cy="71" rx="18" ry="14" fill="none" stroke="#C8102E" stroke-width="1"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">machha</text>
  </g>
  <!-- Row 2 -->
  <g transform="translate(30,210)">
    <!-- Knot -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <path d="M30 30 Q50 10 70 30 Q90 50 70 70 Q50 90 30 70 Q10 50 30 30 Z" fill="none" stroke="#161513" stroke-width="1.5"/>
    <path d="M50 30 Q70 50 50 70 Q30 50 50 30 Z" fill="#C8102E" fill-opacity="0.15" stroke="#C8102E" stroke-width="1"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">granthi</text>
  </g>
  <g transform="translate(145,210)">
    <!-- Elephant -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <ellipse cx="50" cy="55" rx="28" ry="22" fill="none" stroke="#161513" stroke-width="1.5"/>
    <ellipse cx="50" cy="38" rx="16" ry="12" fill="none" stroke="#161513" stroke-width="1.5"/>
    <path d="M34 50 Q18 58 22 72 Q26 82 34 78" fill="none" stroke="#161513" stroke-width="1.5"/>
    <circle cx="44" cy="36" r="2.5" fill="#161513"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">hati</text>
  </g>
  <g transform="translate(260,210)">
    <!-- Swastika (traditional Nepali) -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <path d="M50 20 L50 50 L80 50 M50 50 L50 80 M50 50 L20 50 M20 50 L20 30 M80 50 L80 70 M50 20 L70 20 M50 80 L30 80" fill="none" stroke="#C8102E" stroke-width="2.5" stroke-linecap="square"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">swastika</text>
  </g>
  <g transform="translate(375,210)">
    <!-- Wave border -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <path d="M10 35 Q25 20 40 35 Q55 50 70 35 Q85 20 100 35" fill="none" stroke="#E89B2C" stroke-width="1.5"/>
    <path d="M10 50 Q25 35 40 50 Q55 65 70 50 Q85 35 100 50" fill="none" stroke="#C8102E" stroke-width="1.5"/>
    <path d="M10 65 Q25 50 40 65 Q55 80 70 65 Q85 50 100 65" fill="none" stroke="#E89B2C" stroke-width="1.5"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">lahar</text>
  </g>
  <g transform="translate(490,210)">
    <!-- Star of 8 -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <polygon points="50,15 56,38 79,30 64,48 85,58 62,60 68,84 50,68 32,84 38,60 15,58 36,48 21,30 44,38" fill="none" stroke="#C8102E" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="8" fill="#C8102E" fill-opacity="0.2" stroke="#C8102E" stroke-width="1"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">ashtamangal</text>
  </g>
  <g transform="translate(605,210)">
    <!-- Paisley -->
    <rect width="100" height="100" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
    <path d="M50 75 Q25 70 22 50 Q19 30 40 22 Q60 14 68 32 Q76 50 58 58 Q46 62 50 75 Z" fill="none" stroke="#C8102E" stroke-width="1.5"/>
    <path d="M50 68 Q32 64 30 50 Q28 36 42 30" fill="none" stroke="#E89B2C" stroke-width="1"/>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#8B867B" text-anchor="middle">kalka</text>
  </g>
  <!-- Row 3 (partial, showing process) -->
  <g transform="translate(30,348)">
    <rect width="100" height="100" fill="#F0EDE5" stroke="#D8D4C8" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="50" y="46" font-family="monospace" font-size="9" fill="#8B867B" text-anchor="middle">in</text>
    <text x="50" y="60" font-family="monospace" font-size="9" fill="#8B867B" text-anchor="middle">review</text>
    <text x="50" y="115" font-family="monospace" font-size="8" fill="#C8102E" text-anchor="middle">+143 more</text>
  </g>
  <!-- Right panel: process notes -->
  <rect x="380" y="348" width="390" height="170" rx="3" fill="#fff" stroke="#E0D8C8" stroke-width="1"/>
  <rect x="380" y="348" width="390" height="32" rx="3" fill="#161513"/>
  <text x="400" y="369" font-family="monospace" font-size="10" fill="#FBFAF6">RESEARCH PROCESS</text>
  <text x="400" y="400" font-family="Georgia,serif" font-size="13" fill="#161513">45+ artisan interviews across Nepal.</text>
  <text x="400" y="420" font-family="Georgia,serif" font-size="13" fill="#161513">Motifs sorted by region, material,</text>
  <text x="400" y="440" font-family="Georgia,serif" font-size="13" fill="#161513">and symbolic weight.</text>
  <text x="400" y="468" font-family="monospace" font-size="10" fill="#C8102E">Reduced to 3 collections.</text>
  <text x="400" y="488" font-family="monospace" font-size="10" fill="#8B867B">Trademarked: Himal · Pahaad · Terai</text>
  <text x="400" y="508" font-family="monospace" font-size="9" fill="#5A5550">designed on figma · 2024</text>
  <!-- Caption -->
  <rect x="0" y="560" width="800" height="40" fill="#161513"/>
  <text x="30" y="585" font-family="monospace" font-size="12" fill="#8B867B">PHOTO / motif wall / artisan references · 150+ motifs, reduced by hand</text>
</svg>

  <rect x="350" y="250" width="40" height="52" rx="1" fill="#C8D8E8" stroke="#8B867B" stroke-width="1"/>
  <rect x="430" y="250" width="40" height="52" rx="1" fill="#C8D8E8" stroke="#8B867B" stroke-width="1"/>
  <rect x="510" y="250" width="40" height="52" rx="1" fill="#C8D8E8" stroke="#8B867B" stroke-width="1"/>
  <rect x="270" y="330" width="40" height="52" rx="1" fill="#C8D8E8" stroke="#8B867B" stroke-width="1"/>
  <rect x="350" y="330" width="40" height="52" rx="1" fill="#C8D8E8" stroke="#8B867B" stroke-width="1"/>
  <rect x="430" y="330" width="40" height="52" rx="1" fill="#C8D8E8" stroke="#8B867B" stroke-width="1"/>
  <rect x="510" y="330" width="40" height="52" rx="1" fill="#C8D8E8" stroke="#8B867B" stroke-width="1"/>
